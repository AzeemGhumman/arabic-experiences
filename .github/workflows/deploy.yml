name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-arabic-azeemghumman
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish arabic.azeemghumman.com
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::711609367175:role/github-actions-arabic-experiences
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Upload to S3 and invalidate CloudFront
        env:
          CI: "true"
          SKIP_BUILD: "1"
        run: ./deploy/sync.sh
