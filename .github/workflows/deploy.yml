name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-arabic-azeemghumman
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish arabic.azeemghumman.com
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      AWS_PROFILE: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::711609367175:role/github-actions-arabic-experiences
          aws-region: us-east-1

      - name: Upload to S3 and invalidate CloudFront
        env:
          CI: "true"
          SKIP_BUILD: "1"
          AWS_PROFILE: ""
        run: ./deploy/sync.sh
